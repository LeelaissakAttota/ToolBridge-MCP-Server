name: toolbridge

x-toolbridge-runtime: &toolbridge-runtime
  image: toolbridge-mcp:1.0.0
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  env_file:
    - path: .env
      required: false

services:
  api:
    <<: *toolbridge-runtime
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TOOLBRIDGE_VERSION: 1.0.0
    environment:
      TOOLBRIDGE_ENVIRONMENT: production
      TOOLBRIDGE_HOST: 0.0.0.0
      TOOLBRIDGE_PORT: 8000
      TOOLBRIDGE_OPERATIONS__CURRENT_PHASE: Phase 7 - Deployment & v1.0.0 Release
      TOOLBRIDGE_OPERATIONS__DASHBOARD_API_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:${TOOLBRIDGE_API_PORT:-8000}:8000"
      - "127.0.0.1:${TOOLBRIDGE_DASHBOARD_PORT:-8501}:8501"
    volumes:
      - toolbridge-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  dashboard:
    <<: *toolbridge-runtime
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
    environment:
      TOOLBRIDGE_ENVIRONMENT: production
      TOOLBRIDGE_OPERATIONS__CURRENT_PHASE: Phase 7 - Deployment & v1.0.0 Release
      TOOLBRIDGE_OPERATIONS__DASHBOARD_API_URL: http://127.0.0.1:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
    command:
      - python
      - -m
      - streamlit
      - run
      - toolbridge/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  toolbridge-data:
    name: toolbridge-data

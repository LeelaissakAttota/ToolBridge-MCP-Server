name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Verify formatting
        run: python -m ruff format --check toolbridge tests scripts

      - name: Run static checks
        run: python -m ruff check toolbridge tests scripts

      - name: Run all tests
        run: python -m pytest tests --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: error

      - name: Verify local API and dashboard startup
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn toolbridge.main:app --host 127.0.0.1 --port 8000 --no-access-log &
          api_pid=$!
          python -m streamlit run toolbridge/dashboard/app.py \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            --server.headless=true \
            --browser.gatherUsageStats=false &
          dashboard_pid=$!
          trap 'kill "$dashboard_pid" "$api_pid" 2>/dev/null || true' EXIT
          python scripts/verify_release.py --timeout-seconds 60

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag toolbridge-mcp:1.0.0 .

      - name: Start production stack
        run: docker compose up --detach --no-build

      - name: Verify API, tools, providers, readiness, and dashboard
        run: python scripts/verify_release.py --timeout-seconds 90

      - name: Export image artifact on release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker save toolbridge-mcp:1.0.0 | gzip > toolbridge-mcp-1.0.0.tar.gz
          sha256sum toolbridge-mcp-1.0.0.tar.gz > toolbridge-mcp-1.0.0.tar.gz.sha256

      - name: Upload release image artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: toolbridge-mcp-1.0.0-image
          path: |
            toolbridge-mcp-1.0.0.tar.gz
            toolbridge-mcp-1.0.0.tar.gz.sha256
          if-no-files-found: error

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop production stack
        if: always()
        run: docker compose down --volumes --remove-orphans

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbridge-mcp-server"
version = "1.1.0"
description = "One interface for AI assistants to discover and use tools for APIs, local data, and text analysis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Attota Leelaissak" }]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["toolbridge*"]

[tool.ruff]
target-version = "py312"
line-length = 99
extend-exclude = ["pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-p", "no:cacheprovider"]
markers = [
    "postgres: optional live PostgreSQL test; skipped unless TOOLBRIDGE_TEST_POSTGRES_DSN is set",
]

[tool.mypy]
python_version = "3.12"
files = ["toolbridge"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
